name: IP Test


on:

  schedule:

    # 每3小时执行一次

    - cron: '0 */3 * * *'


  workflow_dispatch:



jobs:


  collect-ips:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:



    # 拉取代码

    - name: Checkout code

      uses: actions/checkout@v4





    # Python环境

    - name: Set up Python

      uses: actions/setup-python@v5

      with:

        python-version: '3.11'





    # 安装依赖

    - name: Install Python dependencies

      run: |

        python -m pip install --upgrade pip

        pip install requests urllib3





    # 运行 Senflare-IP

    - name: Run IP Test

      run: |

        python IPtest.py





    # 下载 CloudflareSpeedTest

    - name: Install CloudflareSpeedTest

      run: |


        wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz



        tar -zxf cfst_linux_amd64.tar.gz



        echo "===== 查看解压结果 ====="



        ls -al



        echo "===== 查看程序 ====="



        ls -al cfst_linux_amd64





    # CloudflareSpeedTest测速

    - name: Run CloudflareSpeedTest

      run: |


        echo "准备测速IP文件"



        cp IPlist-Pro.txt ip.txt



        echo "当前测速IP列表："



        cat ip.txt



        echo "开始 CloudflareSpeedTest"



        chmod +x cfst_linux_amd64/cfst



        ./cfst_linux_amd64/cfst \
        -f ip.txt \
        -o result.csv \
        -t 20





    # 保存测速结果

    - name: Upload results

      uses: actions/upload-artifact@v4


      with:


        name: ip-results


        path: |


          IPlist.txt

          Senflare.txt

          IPlist-Pro.txt

          Senflare-Pro.txt

          Ranking.txt

          IPtest.log

          Cache.json

          result.csv





    # 提交更新

    - name: Commit results

      run: |


        git config --local user.email "action@github.com"


        git config --local user.name "GitHub Action"



        git add .



        git diff --staged --quiet || git commit -m "Update IP results $(date)"



        git push
