name: IP Test


on:

  schedule:

    # 每3小时执行一次

    - cron: '0 */3 * * *'


  workflow_dispatch:



jobs:


  collect-ips:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:



    # 拉取仓库代码

    - name: Checkout code

      uses: actions/checkout@v4




    # 安装Python

    - name: Set up Python

      uses: actions/setup-python@v5

      with:

        python-version: '3.11'




    # 安装依赖

    - name: Install Python dependencies

      run: |

        python -m pip install --upgrade pip

        pip install requests urllib3




    # 运行 Senflare-IP

    - name: Run IP Test

      run: |

        python IPtest.py





    # 安装 CloudflareSpeedTest

    - name: Install CloudflareSpeedTest

      run: |


        wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz


        tar -zxf cfst_linux_amd64.tar.gz



        echo "===== 查看解压内容 ====="


        ls -al



        echo "===== 查看程序目录 ====="


        ls -al cfst_linux_amd64





    # 开始测速

    - name: Run CloudflareSpeedTest

      run: |


        echo "开始 CloudflareSpeedTest"



        chmod +x cfst_linux_amd64/cfst



        ./cfst_linux_amd64/cfst \

        -f IPlist-Pro.txt \

        -o result.csv \

        -t 20






    # 保存结果

    - name: Upload results


      uses: actions/upload-artifact@v4


      with:


        name: ip-results


        path: |


          IPlist.txt

          Senflare.txt

          IPlist-Pro.txt

          Senflare-Pro.txt

          Ranking.txt

          IPtest.log

          Cache.json

          result.csv





    # 自动提交结果

    - name: Commit results


      run: |


        git config --local user.email "action@github.com"


        git config --local user.name "GitHub Action"



        git add .



        git diff --staged --quiet || git commit -m "Update IP results $(date)"



        git push
