name: IP Test

on:
  schedule:
    # 每3小时运行一次
    - cron: '0 */3 * * *'

  workflow_dispatch:


jobs:

  collect-ips:

    runs-on: ubuntu-latest


    permissions:

      contents: write


    steps:


    # 拉取代码

    - name: Checkout code

      uses: actions/checkout@v4



    # 安装Python

    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: '3.11'



    # 安装依赖

    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        pip install requests urllib3



    # 运行Senflare-IP

    - name: Run Senflare IP Test

      run: |

        python IPtest.py



    # 下载CloudflareSpeedTest

    - name: Install CloudflareSpeedTest

      run: |

        wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz

        tar -zxf cfst_linux_amd64.tar.gz

        chmod +x cfst



    # 使用CFST测速

    - name: Run CloudflareSpeedTest

      run: |

        ./cfst \
        -f IPlist-Pro.txt \
        -o result.csv \
        -t 20



    # 上传结果

    - name: Upload results

      uses: actions/upload-artifact@v4

      with:

        name: ip-results

        path: |

          IPlist.txt

          Senflare.txt

          IPlist-Pro.txt

          Senflare-Pro.txt

          Ranking.txt

          IPtest.log

          Cache.json

          result.csv



    # 保存结果到仓库

    - name: Commit results

      run: |

        git config --local user.email "action@github.com"

        git config --local user.name "GitHub Action"


        git add .


        git diff --staged --quiet || git commit -m "Update IP results $(date)"


        git push
