# IP Test - Cloudflare优选IP采集器自动化工作流 v2.3.0 + Cloudflare DNS自动更新

name: IP Test

on:
  schedule:
    # 每3小时执行一次
    - cron: '0 */3 * * *'

  workflow_dispatch:


jobs:

  collect-ips:

    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: read


    steps:


    # 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

      with:
        token: ${{ secrets.GITHUB_TOKEN }}



    # 配置Python
    - name: Set up Python
      uses: actions/setup-python@v5

      with:
        python-version: '3.11'



    # 安装依赖
    - name: Install Python dependencies

      run: |

        python -m pip install --upgrade pip

        pip install requests urllib3



    # 执行IP检测
    - name: Run IP Test

      run: |

        python IPtest.py




    # 上传结果

    - name: Upload results

      uses: actions/upload-artifact@v4

      with:

        name: ip-results

        path: |

          IPlist.txt

          Senflare.txt

          IPlist-Pro.txt

          Senflare-Pro.txt

          Ranking.txt

          IPtest.log

          Cache.json





    # 提交结果

    - name: Commit results

      run: |

        git config --local user.email "action@github.com"

        git config --local user.name "GitHub Action"


        git add IPlist.txt Senflare.txt IPlist-Pro.txt Senflare-Pro.txt Ranking.txt Cache.json


        git diff --staged --quiet || git commit -m "Update IP results - $(date)"


        git push





    # 自动更新Cloudflare优选域名

    - name: Update Cloudflare DNS

      env:

        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

        CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}


      run: |


        pip install requests


        python update_dns.py
